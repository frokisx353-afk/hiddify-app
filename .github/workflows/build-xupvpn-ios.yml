name: build-xupvpn-ios

on:
  workflow_dispatch:

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: dev

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Rewrite submodule SSH URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Codegen (pub get + build_runner + slang)
        run: make get gen translate

      - name: Download prebuilt core (HiddifyCore.xcframework)
        run: make ios-libs

      - name: CocoaPods install
        run: |
          cd ios
          pod repo update
          pod install

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define=sentry_dsn=

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry XupVPN-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XupVPN-iOS-unsigned
          path: XupVPN-unsigned.ipa
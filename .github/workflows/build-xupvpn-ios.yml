name: build-xupvpn-ios

on:
  workflow_dispatch:

env:
  IS_GITHUB_ACTIONS: 1
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: 'url.https://github.com/.insteadOf'
  GIT_CONFIG_VALUE_0: 'ssh://git@github.com/'
  GIT_CONFIG_KEY_1: 'url.https://github.com/.insteadOf'
  GIT_CONFIG_VALUE_1: 'git@github.com:'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules over HTTPS
        run: |
          git config -f .gitmodules submodule.hiddify-core.url https://github.com/hiddify/hiddify-core.git
          git submodule sync --recursive
          git submodule update --init --force --depth=1 --recursive

      - name: Select newest Xcode (need 26+ for Icon Composer)
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Setup Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Codegen (pub get + build_runner + slang)
        run: make get gen translate

      - name: Download prebuilt core (HiddifyCore.xcframework)
        run: make ios-libs
        env:
          CHANNEL: prod

      - name: CocoaPods install
        run: |
          cd ios
          pod repo update
          pod install

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define=sentry_dsn=

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry XupVPN-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XupVPN-iOS-unsigned
          path: XupVPN-unsigned.ipa